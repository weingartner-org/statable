<style>
/* Wortmarke: Atkinson Hyperlegible Next (Braille Institute, SIL OFL), 300 und 800; 400 nur für den Slogan. */
@font-face{font-family:'Atkinson Hyperlegible Next';src:url(./fonts/atkinson-next-300.woff2) format('woff2');font-weight:300;font-display:swap}
@font-face{font-family:'Atkinson Hyperlegible Next';src:url(./fonts/atkinson-next-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Atkinson Hyperlegible Next';src:url(./fonts/atkinson-next-800.woff2) format('woff2');font-weight:800;font-display:swap}
/* Ladebildschirm (Entwurf „D hell“, 08.10.2026) - steht im HTML, damit er sofort da ist, bevor ein Skript läuft. */
#lade{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;background:#F7F5F0 url(./laden-hintergrund.svg) center/cover no-repeat;font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;color:#1D2530;transition:opacity .35s ease}
#lade.weg{opacity:0;pointer-events:none}
.start-karte{box-sizing:border-box;width:min(640px,100%);padding:clamp(28px,5vw,44px) clamp(20px,5vw,56px);background:rgba(255,254,251,.94);border:1px solid #DDD8CF;border-radius:28px;box-shadow:0 1px 2px rgba(29,37,48,.06),0 24px 60px rgba(29,37,48,.10);display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
/* Marke mit Slogan (18.10.2026, Johannes): alles in em der Wortmarke, aus den Schriftmaßen gerechnet (Atkinson Next: Oberlänge 0,708, Grundlinie bei line-height 1 auf 0,834).
   Slogan genau so breit wie „statable“ (0,3177 em). Logo von der Oberkante von „able“ bis zur Grundlinie des Slogans, je 1 % Überstand für die runden Ecken. */
.start-marke{display:flex;align-items:flex-start;gap:.35em;font-size:clamp(40px,8vw,72px)}
.start-marke svg{width:1.302em;height:1.302em;margin-top:.112em;flex:none}
.start-text{display:flex;flex-direction:column;align-items:flex-start;gap:.135em;text-align:left}
.start-wort{font-size:1em;line-height:1;letter-spacing:-.02em;font-weight:300}
.start-wort b{font-weight:800;color:#17756A}
.start-slogan{font-size:.3177em;line-height:1;font-weight:400;color:#4C5661;white-space:nowrap}
.start-z{display:inline-block}
.start-karte p{margin:0;font-size:18px;color:#4C5661}
/* Ladeanimation „B - Linie zieht sich“ (08.10.2026): Punkte ploppen nacheinander auf, die Trendlinie zeichnet sich, der letzte Punkt wird Koralle (09.10.: Logo hell, Variante B). Ersetzt den Ladebalken. */
.start-marke svg{overflow:visible}
.start-linie{stroke-dasharray:54;animation:start-zieh 3.2s ease-in-out infinite both}
.start-p{transform-box:fill-box;transform-origin:center;animation-duration:3.2s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.3,1.4,.5,1)}
.start-p1{animation-name:start-auf1}.start-p2{animation-name:start-auf2}.start-p3{animation-name:start-auf3}.start-p4{animation-name:start-auf4}
@keyframes start-zieh{0%{stroke-dashoffset:54;opacity:1}40%,84%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes start-auf1{0%,6%{transform:scale(0)}16%,84%{transform:scale(1);opacity:1}96%,100%{transform:scale(1);opacity:0}}
@keyframes start-auf2{0%,14%{transform:scale(0)}24%,84%{transform:scale(1);opacity:1}96%,100%{transform:scale(1);opacity:0}}
@keyframes start-auf3{0%,22%{transform:scale(0)}32%,84%{transform:scale(1);opacity:1}96%,100%{transform:scale(1);opacity:0}}
@keyframes start-auf4{0%,32%{transform:scale(0);fill:#17756A}42%{transform:scale(1.25);fill:#17756A}50%{transform:scale(1);fill:#C4502F}84%{transform:scale(1);fill:#C4502F;opacity:1}96%,100%{transform:scale(1);fill:#C4502F;opacity:0}}
@media (prefers-reduced-motion:reduce){.start-linie,.start-p{animation:none}#lade{transition:none}}
</style>
